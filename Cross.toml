# Cross-compile with `cross build --release --target aarch64-unknown-linux-gnu`.
# midir's ALSA backend links libasound, so the target's dev package is needed.
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install -y libasound2-dev:$CROSS_DEB_ARCH",
]

[target.armv7-unknown-linux-gnueabihf]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install -y libasound2-dev:$CROSS_DEB_ARCH",
]
