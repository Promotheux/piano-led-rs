[package]
name = "plv"
version = "0.1.0"
edition = "2021"
description = "Lightweight Piano LED Visualizer engine for Raspberry Pi Zero 2 W (WS2812B over SPI/DMA)"
license = "MIT"
rust-version = "1.79"

[dependencies]
midir = "0.11"
ctrlc = { version = "3.5", features = ["termination"] }  # SIGINT + SIGTERM (systemctl stop)
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
midly = { version = "0.5", default-features = false, features = ["alloc", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

# rppal only builds on Linux; on other hosts the SPI driver is compiled out and
# the terminal/null drivers are used for development.
[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.22"
# Same rpi_ws281x C library the original uses. Needs a C compiler, libclang
# and git at build time, so it's opt-in.
rs_ws281x = { version = "0.5", optional = true }

[features]
# PWM + DMA driver on GPIO18 (original wiring, LCD HAT compatible).
pwm = ["dep:rs_ws281x"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
