<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano LED">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Piano LED</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="/icon.svg" alt=""><span>Piano LED</span></div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="library" role="tab">Library</button>
    <button class="tab" data-view="player" role="tab">Play</button>
    <button class="tab" data-view="apps" role="tab">Apps</button>
    <button class="tab" data-view="settings" role="tab">Settings</button>
  </nav>
  <div class="topright">
    <span id="conn" class="conn" title="Connection to the Pi"></span>
    <button id="fullscreen" class="icon-btn" aria-label="Full screen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9V4.5H9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15"/></svg></button>
  </div>
</header>

<main>
  <!-- Filled by the Svelte Library (ui-src/, built to /dist/app.js). -->
  <section id="library" class="view active"></section>

  <section id="player" class="view">
    <div class="songbar">
      <span id="title" class="title">No song loaded</span>
      <span id="score" class="time" title="Notes you played that fit the song / that didn't"></span>
      <span id="time" class="time">0:00 / 0:00</span>
    </div>
    <div class="stage">
      <canvas id="roll"></canvas>
      <div id="waiting" class="badge" hidden>Waiting for you…</div>
      <div id="empty" class="empty">Pick a song in the Library to start.</div>
      <div id="card" class="scorecard" role="dialog" aria-labelledby="card-title" hidden>
        <h3 id="card-title">Song finished</h3>
        <dl id="card-stats" class="tr-stats"></dl>
        <p id="card-best" class="tr-keys"></p>
        <div class="row">
          <button id="card-close" class="btn">Close</button>
          <button id="card-again" class="btn primary">Play again</button>
        </div>
      </div>
    </div>
    <div class="controls">
      <div class="row">
        <button id="restart" class="icon-btn big" aria-label="Restart"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6v12" /><path d="M18 6.5v11L10 12z" fill="currentColor" stroke="none"/></svg></button>
        <button id="play" class="icon-btn big primary" aria-label="Play"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg></button>
        <input id="scrub" type="range" min="0" max="1" value="0" step="10" aria-label="Position">
      </div>
      <div class="row wrap">
        <div class="seg" id="mode">
          <button data-v="wait">Wait for me</button>
          <button data-v="other">Play along</button>
          <button data-v="listen">Listen</button>
        </div>
        <div class="seg" id="hand">
          <button data-v="left">Left</button>
          <button data-v="both">Both</button>
          <button data-v="right">Right</button>
        </div>
        <label class="tempo">Tempo <input id="tempo" type="range" min="25" max="150" step="5" value="100"><b id="tempoval">100%</b></label>
        <div class="seg small" id="loop">
          <button data-v="a">A</button><button data-v="b">B</button><button data-v="clear">✕</button>
        </div>
        <button id="ramp" class="btn ghost toggle" aria-pressed="false" disabled
          title="After each pass through the A–B loop without a wrong note, play 5% faster, up to 100%">Speed up</button>
        <button id="metro" class="btn ghost toggle" aria-pressed="false" title="Click on every beat (on this tablet)">Metronome</button>
        <button id="countin" class="btn ghost toggle" aria-pressed="false" title="Count one bar in before the song starts or resumes">Count-in</button>
        <div class="seg" id="view">
          <button data-v="waterfall">Waterfall</button>
          <button data-v="sheet">Sheet</button>
        </div>
        <button id="tracksbtn" class="btn ghost">Tracks</button>
      </div>
    </div>
    <dialog id="tracks">
      <h3>Which hand plays each track?</h3>
      <div id="tracklist"></div>
      <form method="dialog"><button class="btn">Done</button></form>
    </dialog>
  </section>

  <section id="apps" class="view">
    <div class="app-grid">
      <button class="app-tile" data-open="trainer"><span class="app-icon">🎯</span><b>Pitch trainer</b><small>Name notes, intervals and chords by ear</small></button>
      <button class="app-tile" data-open="improv"><span class="app-icon">🎷</span><b>Improv</b><small>Jam over chords and see which notes fit</small></button>
      <button class="app-tile" data-open="harmony"><span class="app-icon">🎼</span><b>Chord progressions</b><small>Play I–IV–V, ii–V–I and more in any key</small></button>
    </div>
  </section>

  <section id="trainer" class="view" data-tab="apps">
    <button class="btn ghost back" data-open="apps">‹ Apps</button>
    <div class="app-mount"></div><!-- Svelte (Trainer.svelte, built to /dist/app.js) -->
  </section>

  <section id="improv" class="view" data-tab="apps">
    <button class="btn ghost back" data-open="apps">‹ Apps</button>
    <div class="app-mount"></div><!-- Svelte (Improv.svelte, built to /dist/app.js) -->
  </section>

  <section id="harmony" class="view" data-tab="apps">
    <button class="btn ghost back" data-open="apps">‹ Apps</button>
    <div class="app-mount"></div><!-- Svelte (Harmony.svelte, built to /dist/app.js) -->
  </section>

  <!-- Filled by the Svelte Settings (ui-src/, built to /dist/app.js). -->
  <section id="settings" class="view"></section>
</main>
<div id="toast" role="status"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
